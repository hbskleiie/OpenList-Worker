name: Sync Upstream and Deploy OpenList Worker

on:
  schedule:
    # UTC 01:17 = 北京时间 09:17
    - cron: "17 1 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 避免同步、部署同时运行
concurrency:
  group: openlist-cloudflare-main
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check and sync upstream
        id: sync
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail

          # 自己推送 main 时，直接部署
          if [ "$EVENT_NAME" = "push" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git remote add upstream \
            https://github.com/OpenListTeam/OpenList-Worker.git
          git fetch upstream main

          # 判断上游是否有尚未合并的提交
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "上游没有新提交"

            # 手动运行仍然部署，方便重试
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "deploy=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # 正常合并，保留本仓库的修改；冲突时停止
          if ! git merge --no-edit upstream/main; then
            git merge --abort
            echo "::error::上游与本仓库存在冲突，请手动解决后重新运行"
            exit 1
          fi

          git push origin HEAD:main
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: steps.sync.outputs.deploy == 'true'
        uses: pnpm/action-setup@v4
        # 自动读取 package.json 中的 packageManager 版本

      - name: Setup Node
        if: steps.sync.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.sync.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.sync.outputs.deploy == 'true'
        run: pnpm run build

      - name: Deploy to Cloudflare
        if: steps.sync.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
